    <section class="contact-section">
        <div class="container">
            
            <!-- LEFT SIDE: FORM -->
            <div class="form-wrapper">
                <h2>Send me a message!</h2>
                <p id="status-message"></p>
                
                <!-- REPLACE 'YOUR_FORMSPREE_URL_HERE' WITH YOUR LINK -->
                <form id="contact-form" action="https://formspree.io/f/mbdwordv" method="POST">
                    <input type="text" name="name" placeholder="Your Name" required>
                    <input type="email" name="email" placeholder="Your Email" required>
                    <textarea name="message" rows="6" placeholder="Your Message" required></textarea>
                    <button type="submit" id="submit-btn">Send Message</button>
                </form>
            </div>

            <!-- RIGHT SIDE: MAP -->
            <div class="map-wrapper">
                <h3>Find Me Here</h3>
                <div class="map-container">
                    <!-- Google Maps Embed for Cebu City (based on your image) -->
                    <iframe src="https://www.google.com/maps/embed?pb=!1m17!1m12!1m3!1d3926.092203588041!2d123.84743807354432!3d10.25414726861303!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m2!1m1!2zMTDCsDE1JzE0LjkiTiAxMjPCsDUxJzAwLjEiRQ!5e0!3m2!1sen!2sph!4v1777922973344!5m2!1sen!2sph" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>

        </div>
    </section>

    <script src="script.js"></script>
